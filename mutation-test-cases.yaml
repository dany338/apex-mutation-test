# Mutation 2: Standard Class - DiscountCalculator 
className: DiscountCalculator
type: standard
description: "Mutate discount percentage to test calculation logic"
originalCode: "return totalAmount * 0.1;"
mutatedCode: "return totalAmount * 0.05;"
expectedImpact:
  - testDiscountOverThreshold
  - testDiscountExactlyThreshold
reason: "Changes discount from 10% to 5% which should make calculations fail"

