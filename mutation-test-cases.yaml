originalCode: "idRecord = null; // 📝 Description: Set `idRecord` to `null` to simulate a failure in handling input data. - 💥 Expected impact: `testGenerateAditionalInformation` should fail because the assertion checking the value of `info.nodeData.get(Constants.STRING_ID)` will not match the expected ID."
mutatedCode: "idRecord = input.varIdRecord;"
expectedImpact:
  - testGenerateAditionalInformation
reason: "Restores proper idRecord assignment which should make test pass (inverse mutation)"

