# Mutation Test Cases for Apex Types
# Casos de prueba de mutación para validar la efectividad de los tests

---
# Mutation 1: Standard Class - DiscountCalculator
className: DiscountCalculator
type: standard
description: "Mutate threshold comparison to test boundary conditions"
originalCode: "if (totalAmount >= 1000) {"
mutatedCode: "if (totalAmount > 1000) {"
expectedImpact:
  - testDiscountExactlyThreshold
reason: "Changes >= to > which should make the test fail for exactly 1000"

